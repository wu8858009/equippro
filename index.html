<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquipPro｜企業級設備更換紀錄與價位管理系統</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232a78d6%22/><text x=%2250%22 y=%2266%22 font-size=%2246%22 font-family=%22system-ui%22 fill=%22white%22 text-anchor=%22middle%22>EP</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Launch animation: shown until the app has loaded and rendered (see hideSplash in js/app.js). -->
  <div id="splash" aria-hidden="true">
    <div class="splash-center">
      <div class="splash-logo">
        <span class="splash-ring"></span><span class="splash-ring r2"></span>
        <svg viewBox="0 0 256 256" class="splash-mark">
          <defs>
            <linearGradient id="splash-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4b98f5" /><stop offset="1" stop-color="#1c5cb0" />
            </linearGradient>
          </defs>
          <rect width="256" height="256" rx="56" fill="url(#splash-grad)" />
          <g class="splash-monitor" fill="#fff">
            <rect x="53" y="56" width="150" height="108" rx="16" />
            <rect x="111" y="163" width="34" height="22" />
            <rect x="88" y="184" width="80" height="14" rx="7" />
          </g>
          <path class="splash-check" d="M84 114 L108 138 L170 88" fill="none" stroke="#2a78d6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="splash-title">
        <span>E</span><span>q</span><span>u</span><span>i</span><span>p</span><span>P</span><span>r</span><span>o</span>
      </div>
      <div class="splash-sub">企業級設備更換紀錄與價位管理系統</div>
      <div class="splash-bar"><span></span></div>
    </div>
  </div>
  <script>window.__splashStart = Date.now();</script>
  <div id="app-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- App scripts load one at a time with retries: the desktop app serves them
       from pywebview's small built-in web server, which can drop some of many
       simultaneous requests and leave the app stuck on the splash screen. -->
  <script>
    (function () {
      var files = ['js/vendor/qrcode.js', 'js/storage.js', 'js/auth.js', 'js/equipment.js', 'js/pricing.js', 'js/reports.js', 'js/photos.js', 'js/maintenance.js', 'js/labels.js', 'js/sync.js', 'js/app.js'];
      function fail(name) {
        var el = document.getElementById('splash');
        var box = document.createElement('div');
        box.className = 'splash-error';
        box.innerHTML = '程式檔案載入失敗（' + name + '）<br><button type="button" onclick="location.reload()">重新載入</button>';
        (el ? el.querySelector('.splash-center') : document.body).appendChild(box);
        if (el) el.style.animation = 'none';
      }
      function load(i, attempt) {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + (attempt ? '?retry=' + attempt + '-' + Date.now() : '');
        s.onload = function () { load(i + 1, 0); };
        s.onerror = function () {
          s.remove();
          if (attempt < 5) setTimeout(function () { load(i, attempt + 1); }, 150 * (attempt + 1));
          else fail(files[i]);
        };
        document.body.appendChild(s);
      }
      load(0, 0);
    })();
  </script>
</body>
</html>
